services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: padosipro
    ports:
      - "5434:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d padosipro"]
      interval: 3s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build: ./backend
    # backend/.env is optional here: the defaults below are enough to run locally.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/padosipro
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OTP_SECRET: ${OTP_SECRET:-dev-otp-secret-change-me}
      MAIL_FROM: ${MAIL_FROM:-no-reply@padosipro.local}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  dbdata: